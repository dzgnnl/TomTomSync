# Releases are manually dispatched from main so the workflow definition remains
# trusted. Source from the release tag is built without release credentials;
# publishing runs on separate, fresh runners.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag vX.Y.Z (created on main's latest commit if it doesn't exist yet)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and check out its source
        id: verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a vX.Y.Z tag"
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          if TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}"); then
            if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
              echo "::error::Release tag must point to a commit on main"
              exit 1
            fi
          else
            # New version: tag main's latest commit locally so build-app.sh picks
            # up the version; the publish job pushes the tag with the release.
            TAG_SHA=$(git rev-parse refs/remotes/origin/main)
            git tag "$VERSION" "$TAG_SHA"
          fi
          git checkout --detach "$TAG_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - run: swift test

      - name: Build release archive
        run: scripts/build-app.sh --zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tomtomsync-release
          path: build/TomTomSync-${{ steps.verify.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tomtomsync-release
          path: artifact

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ZIP="artifact/TomTomSync-$VERSION.zip"
          test -f "$ZIP"
          # A published version is never replaced: people may already have it.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists; keeping its archive."
          else
            gh release create "$VERSION" "$ZIP" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "TomTomSync ${VERSION#v}" --generate-notes
          fi

  update-homebrew-cask:
    if: github.ref == 'refs/heads/main'
    needs: [build, publish-release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Secret TAP_TOKEN is not set; see docs/DEVELOPMENT.md#releases. Add it and re-run this job."
            exit 1
          fi
          # The checksum is taken from the archive people will download.
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "TomTomSync-$VERSION.zip" --dir published
          SHA256=$(sha256sum "published/TomTomSync-$VERSION.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/dzgnnl/homebrew-tap.git" tap
          mkdir -p tap/Casks
          scripts/update-cask.sh "${VERSION#v}" "$SHA256" > tap/Casks/tomtomsync.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tomtomsync.rb
          git diff --cached --quiet || { git commit -m "tomtomsync $VERSION" && git push; }
