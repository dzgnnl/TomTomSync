# Push a tag like v0.2.0 to build the app, publish a GitHub release and update
# the Homebrew cask in dzgnnl/homebrew-tap. See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build-app.sh takes the version from the tag

      - run: swift test

      - name: Build
        run: scripts/build-app.sh --zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/TomTomSync-$GITHUB_REF_NAME.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber     # re-run of this workflow
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "TomTomSync ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Secret TAP_TOKEN is not set; see docs/RELEASING.md. Add it and re-run this job."
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 "build/TomTomSync-$GITHUB_REF_NAME.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/dzgnnl/homebrew-tap.git" tap
          mkdir -p tap/Casks
          scripts/update-cask.sh "$VERSION" "$SHA" > tap/Casks/tomtomsync.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tomtomsync.rb
          git diff --cached --quiet || { git commit -m "tomtomsync $VERSION" && git push; }
