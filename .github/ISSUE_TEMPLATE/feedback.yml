name: Feedback
description: A problem, question, idea, or just that it works for you
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback?
      options:
        - Something doesn't work
        - Idea or request
        - Question
        - It works for me
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, or what would you like? For problems, the sync log helps (click the status line in the menu). This issue is public: remove anything you'd rather not share, such as your user name in file paths.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TomTomSync version
  - type: input
    id: macos
    attributes:
      label: macOS version
  - type: input
    id: watch
    attributes:
      label: Watch
      description: Model, e.g. Runner 3 or Spark Music. The code from the app is filled in when known.
